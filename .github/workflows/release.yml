name: Release

# Builds reproducible release artifacts for a pushed v* tag (or on demand).
# Artifacts are attached to a DRAFT GitHub release; the owner publishes it.
# The Android release APK is built unsigned: signing requires owner-controlled
# credentials and must never happen with keys committed or provided to CI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-package:
    name: Python sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Install wheel in a clean venv and run the doctor smoke test
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install dist/*.whl
          .smoke/bin/python -m matrix_ai doctor

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: matrix-python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  python-sbom:
    name: Python dependency SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit
      - name: Generate CycloneDX SBOM
        run: pip-audit --skip-editable --format cyclonedx-json --output matrix-sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: matrix-sbom
          path: matrix-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  android-apks:
    name: Android APKs (release is unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Assemble debug and release APKs
        run: gradle -p android assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: matrix-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft GitHub release with artifacts
    runs-on: ubuntu-latest
    needs: [python-package, python-sbom, android-apks]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ARGS=()
          while IFS= read -r -d '' file; do
            ARGS+=("$file")
          done < <(find artifacts -type f -print0)
          gh release create "$TAG" \
            --draft \
            --title "MATRIX AI $TAG" \
            --generate-notes \
            "${ARGS[@]}"
          echo "Draft release created; the owner reviews and publishes it."
