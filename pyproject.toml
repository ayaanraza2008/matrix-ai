[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "matrix-ai"
version = "0.1.0"
description = "MATRIX - a local-first, JARVIS-inspired personal AI assistant for Windows and Android"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali Raza Zaidi" }]
keywords = ["ai", "assistant", "local-first", "jarvis", "security", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6,<3",
  "psutil>=5.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.0.0",
  "piper-tts>=1.2.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
]
vision = ["opencv-python>=4.9", "pytesseract>=0.3.10", "Pillow>=10.0"]
youtube = ["google-api-python-client>=2.130", "google-auth>=2.29", "google-auth-oauthlib>=1.2", "keyring>=25.6"]
browser = ["playwright>=1.44"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
matrix = "matrix_ai.cli:main"

[project.urls]
Homepage = "https://github.com/ayaanraza2008/matrix-ai"
Documentation = "https://github.com/ayaanraza2008/matrix-ai/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_ai"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "acceptance: maps to the MATRIX acceptance suite (A01-A25)",
  "requires_network: needs outbound network access",
  "requires_windows: only runs on Windows",
  "optional_deps: needs an optional third-party dependency",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/matrix_ai/tools/github_tools.py" = ["E701", "E702", "I001"]
"src/matrix_ai/tools/social_tools.py" = ["E701", "E702", "I001"]
"src/matrix_ai/tools/youtube_tools.py" = ["E701", "E702", "I001"]
"src/matrix_ai/tools/registry.py" = ["I001"]
